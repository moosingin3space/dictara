[package]
name = "dictara"
version = "0.2.4"
description = "Dictara - Speach to text app"
authors = ["Dictara Contributors"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "dictara_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-store = "2"
tauri-plugin-updater = "2"
tauri-plugin-log = "2"
sentry = "0.46.1"
uuid = { version = "1.11", features = ["v4"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dictara-keyboard = { path = "../crates/keyboard" }
cpal = "0.15"
hound = "3.5"
rubato = "0.16"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["blocking", "multipart"] }
arboard = "3.3"
enigo = "0.6"
# Silero VAD - using official implementation directly (no wrapper crate)
# Based on: https://github.com/snakers4/silero-vad/tree/master/examples/rust-example
# Using rc.10 for Intel Mac binary support (rc.11 dropped Intel binaries)
# Pinned to EXACTLY rc.10 to match parakeet-rs 0.2.7 compatibility
# NOTE: Use = for exact version to prevent Dependabot from upgrading
ort = { version = "=2.0.0-rc.10", features = ["copy-dylibs", "download-binaries"] }
ndarray = "0.16"
image = "0.25.9"
derive_more = { version = "2.1.1", features = ["from", "display"] }
# Platform keychain backends are selected per-target below (keyring v3 has no
# default backend; without one every call errors at runtime)
keyring = "3"
specta = { version = "=2.0.0-rc.22", features = ["derive"] }
tauri-specta = { version = "=2.0.0-rc.21", features = ["derive", "typescript"] }
specta-typescript = "0.0.9"
thiserror = "2.0.17"
strum = { version = "0.27.2", features = ["derive"] }
# Local transcription - whisper.cpp bindings (Metal acceleration added for macOS below)
whisper-rs = { version = "0.13", default-features = false }
# Parakeet TDT multilingual transcription via ONNX Runtime
# Pinned to EXACTLY 0.2.7 (last version before ort rc.11 upgrade) for Intel Mac binary support
# NOTE: Use = for exact version to prevent Dependabot from upgrading
# CoreML acceleration added for macOS below
parakeet-rs = { version = "=0.2.7", default-features = false, features = ["ort-defaults"] }
# For async model downloads with progress
futures-util = "0.3"
# For cancellation tokens in downloads
tokio-util = "0.7"
# For SHA-256 checksum verification of downloaded models
sha2 = "0.10"
secrecy = { version = "0.10", features = ["serde"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-graphics = "0.3.1"  # For direct CGEvent posting
objc2-core-foundation = "0.3.1"
objc2-app-kit = { version = "0.3.1", features = ["NSWindow", "NSResponder", "NSRunningApplication", "NSWorkspace"] }
objc2-av-foundation = { version = "0.3.1", features = ["AVCaptureDevice", "AVMediaFormat"] }
objc2 = "0.6"
block2 = "0.6"  # For Objective-C blocks in callbacks
macos-accessibility-client = "0.0.1"
# Metal/CoreML acceleration, macOS-only
whisper-rs = { version = "0.13", features = ["metal"] }
parakeet-rs = { version = "=0.2.7", features = ["coreml"] }
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
# GPU-accelerated whisper.cpp via the GGML Vulkan backend. Requires the
# Vulkan loader/headers and the glslc shader compiler at build time (provided
# by the ci-linux container) and the Vulkan runtime at run time (Mesa/RADV in
# the Flatpak GNOME runtime, reached through --device=dri).
whisper-rs = { version = "0.13", features = ["vulkan"] }
# D-Bus Secret Service backend (GNOME Keyring / KWallet), sync so no extra
# async runtime requirement
keyring = { version = "3", features = ["sync-secret-service"] }
# XDG desktop portals: RemoteDesktop for paste injection on Wayland
# (remote_desktop internally needs the screencast feature's types).
# raw_handle + wayland let us build a WindowIdentifier from the Tauri window
# so the GlobalShortcuts configuration dialog is parented to our window.
ashpd = { version = "0.13", default-features = false, features = ["tokio", "remote_desktop", "screencast", "clipboard", "raw_handle", "wayland", "background"] }
# For HasWindowHandle/HasDisplayHandle on the Tauri window (matches ashpd's)
raw-window-handle = "0.6"
# arboard defaults to the X11 clipboard, but XWayland isn't shared into the
# Flatpak sandbox (DISPLAY points at an unreachable :0), so clipboard writes time
# out. Enable the Wayland data-control backend, which arboard auto-selects when
# WAYLAND_DISPLAY is set. wl-clipboard-rs is Linux-only, hence the target gate.
arboard = { version = "3.3", features = ["wayland-data-control"] }

